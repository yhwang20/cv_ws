controller_names:
  - ur5e_controller
  - robotiq_controller

ur5e_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint

robotiq_controller:
  action_ns: gripper_cmd
  type: GripperCommand
  default: true
  joints:
    - robotiq_85_left_knuckle_joint
